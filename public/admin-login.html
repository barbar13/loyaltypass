<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Fidelyzio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0E0D0A; color: #e5e7eb;
      font-family: "Geist", ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex; align-items: center; justify-content: center; min-height: 100vh;
    }
    .card {
      background: #181610; border: 1px solid rgba(245,158,11,.12);
      border-radius: 22px; padding: 36px 32px; width: 100%; max-width: 360px;
      box-shadow: 0 8px 40px rgba(0,0,0,.4);
    }
    .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; }
    .logo-mark {
      width: 38px; height: 38px; border-radius: 11px;
      background: #F59E0B; position: relative; display: grid; place-items: center; flex-shrink: 0;
    }
    .logo-mark::before {
      content: ""; width: 16px; height: 16px; border-radius: 4px;
      background: #0E0D0A; transform: rotate(45deg);
    }
    .logo-mark::after {
      content: ""; position: absolute; width: 7px; height: 7px;
      border-radius: 2px; background: #F59E0B; transform: rotate(45deg);
    }
    .logo-text { }
    .logo-name { font-size: 18px; font-weight: 700; letter-spacing: -0.02em; color: #f9fafb; }
    .logo-tag  { font-size: 11px; color: rgba(245,158,11,.6); margin-top: 2px; font-weight: 500; }
    h1 { font-size: 20px; font-weight: 700; color: #f9fafb; margin-bottom: 5px; letter-spacing: -0.02em; }
    .sub { color: rgba(255,255,255,.35); font-size: 13px; margin-bottom: 28px; }
    label {
      display: block; color: rgba(255,255,255,.35); font-size: 11px;
      font-weight: 600; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 8px;
    }
    input[type=password] {
      width: 100%; background: rgba(255,255,255,.05); border: 1px solid rgba(245,158,11,.18);
      border-radius: 12px; padding: 13px 14px; font-size: 15px; color: #fff; outline: none;
      transition: border-color .15s, box-shadow .15s; margin-bottom: 20px; font-family: inherit;
    }
    input[type=password]:focus {
      border-color: rgba(245,158,11,.5);
      box-shadow: 0 0 0 3px rgba(245,158,11,.1);
    }
    button {
      width: 100%; padding: 14px; background: #F59E0B; color: #1A1410; border: none;
      border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer;
      transition: background .15s, transform .12s; font-family: inherit;
      box-shadow: 0 8px 24px rgba(245,158,11,.25);
    }
    button:hover { background: #D97706; transform: translateY(-1px); }
    button:active { transform: scale(.98); }
    .err {
      background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.2);
      border-radius: 10px; padding: 10px 14px; color: #f87171;
      font-size: 13px; margin-bottom: 18px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-mark"></div>
      <div class="logo-text">
        <div class="logo-name">Fidelyzio</div>
        <div class="logo-tag">Espace administrateur</div>
      </div>
    </div>

    <h1>Connexion admin</h1>
    <p class="sub">Accès réservé — mot de passe requis.</p>

    <div id="err-box" class="err" style="display:none">Mot de passe incorrect.</div>

    <form method="POST" action="/admin-login">
      <label for="pwd">Mot de passe</label>
      <input type="password" id="pwd" name="password"
             autocomplete="current-password" required autofocus>
      <button type="submit">Accéder →</button>
    </form>
  </div>

  <script>
    if (new URLSearchParams(window.location.search).get('error')) {
      document.getElementById('err-box').style.display = 'block';
    }
  </script>
</body>
</html>
