<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Fidelyzio</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #080810; color: #e5e7eb;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex; align-items: center; justify-content: center; min-height: 100vh;
    }
    .card {
      background: #111827; border: 1px solid rgba(255,255,255,.07);
      border-radius: 20px; padding: 36px 32px; width: 100%; max-width: 360px;
    }
    .logo {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 24px;
    }
    .logo-dot {
      width: 36px; height: 36px; border-radius: 10px; background: #6366f1;
      display: flex; align-items: center; justify-content: center;
    }
    .logo-name { font-size: 18px; font-weight: 900; letter-spacing: -0.3px; color: #f9fafb; }
    .logo-tag  { font-size: 11px; color: #6b7280; margin-top: 1px; }
    h1 { font-size: 20px; font-weight: 800; color: #f9fafb; margin-bottom: 6px; }
    .sub { color: #6b7280; font-size: 13px; margin-bottom: 28px; }
    label {
      display: block; color: rgba(255,255,255,.4); font-size: 11px;
      font-weight: 700; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 8px;
    }
    input[type=password] {
      width: 100%; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1);
      border-radius: 11px; padding: 13px 14px; font-size: 15px; color: #fff; outline: none;
      transition: border-color .15s; margin-bottom: 20px;
    }
    input[type=password]:focus { border-color: rgba(99,102,241,.6); }
    button {
      width: 100%; padding: 14px; background: #6366f1; color: #fff; border: none;
      border-radius: 11px; font-size: 15px; font-weight: 700; cursor: pointer;
      transition: background .15s;
    }
    button:hover { background: #4f46e5; }
    .err {
      background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.25);
      border-radius: 10px; padding: 10px 14px; color: #f87171;
      font-size: 13px; margin-bottom: 18px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-dot">
        <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="white" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M3.75 4.875c0-.621.504-1.125 1.125-1.125h4.5c.621 0 1.125.504 1.125 1.125v4.5c0 .621-.504 1.125-1.125 1.125h-4.5A1.125 1.125 0 0 1 3.75 9.375v-4.5Z
               M3.75 14.625c0-.621.504-1.125 1.125-1.125h4.5c.621 0 1.125.504 1.125 1.125v4.5c0 .621-.504 1.125-1.125 1.125h-4.5a1.125 1.125 0 0 1-1.125-1.125v-4.5Z
               M13.5 4.875c0-.621.504-1.125 1.125-1.125h4.5c.621 0 1.125.504 1.125 1.125v4.5c0 .621-.504 1.125-1.125 1.125h-4.5A1.125 1.125 0 0 1 13.5 9.375v-4.5Z"/>
        </svg>
      </div>
      <div>
        <div class="logo-name">Fidelyzio</div>
        <div class="logo-tag">Espace administrateur</div>
      </div>
    </div>

    <h1>Connexion admin</h1>
    <p class="sub">Accès réservé — mot de passe requis.</p>

    <div id="err-box" class="err" style="display:none">Mot de passe incorrect.</div>

    <form method="POST" action="/admin-login">
      <label for="pwd">Mot de passe</label>
      <input type="password" id="pwd" name="password"
             autocomplete="current-password" required autofocus>
      <button type="submit">Accéder →</button>
    </form>
  </div>

  <script>
    if (new URLSearchParams(window.location.search).get('error')) {
      document.getElementById('err-box').style.display = 'block';
    }
  </script>
</body>
</html>
