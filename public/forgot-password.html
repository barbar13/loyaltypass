<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0f">
  <title>Mot de passe oublié — Fidevo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { min-height: 100%; background: #0a0a0f; color: #e5e7eb;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; overscroll-behavior: none; }
    input { font-size: 16px !important; }
    .pt-safe { padding-top: max(1.5rem, env(safe-area-inset-top)); }
    .pb-safe { padding-bottom: max(1.5rem, env(safe-area-inset-bottom)); }
    .field { width:100%; background:#1a1a24; border:1px solid rgba(255,255,255,.1);
      border-radius:14px; padding:14px 16px; color:white; outline:none;
      transition: border-color .2s, box-shadow .2s; }
    .field::placeholder { color:#4b5563; }
    .field:focus { border-color:#6366f1; box-shadow:0 0 0 3px rgba(99,102,241,.2); }
    @keyframes fade-up { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
    .au { animation: fade-up .4s cubic-bezier(.16,1,.3,1) both; }
    .d1 { animation-delay:.06s; }
  </style>
</head>
<body>
<div class="min-h-dvh flex flex-col items-center justify-center px-5 pt-safe pb-safe">

  <div class="mb-8 text-center au">
    <a href="/login" class="text-gray-500 text-sm hover:text-gray-300 transition">← Retour à la connexion</a>
    <h1 class="text-white text-2xl font-bold mt-4">Mot de passe oublié</h1>
    <p class="text-gray-500 text-sm mt-1">Entrez votre email pour recevoir un lien de réinitialisation.</p>
  </div>

  <div id="form-wrap" class="w-full max-w-sm au d1">
    <form id="forgot-form" class="bg-gray-900 rounded-3xl p-6 shadow-2xl space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-300 mb-2">Adresse e-mail</label>
        <input id="inp-email" type="email" autocomplete="email" placeholder="vous@email.com" required class="field">
      </div>
      <div id="form-error" class="hidden rounded-xl px-4 py-3 bg-red-500/10 border border-red-500/25 text-red-400 text-sm flex items-center gap-2">
        <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z"/></svg>
        <span id="err-msg"></span>
      </div>
      <button type="submit" id="submit-btn"
              class="w-full py-4 rounded-2xl bg-indigo-600 hover:bg-indigo-500 active:scale-[.98] disabled:opacity-60 text-white font-semibold text-base transition-all shadow-lg shadow-indigo-600/25">
        Envoyer le lien
      </button>
    </form>
  </div>

  <!-- Success state -->
  <div id="success-wrap" style="display:none" class="w-full max-w-sm text-center au">
    <div class="w-16 h-16 rounded-full bg-emerald-500/15 flex items-center justify-center mx-auto mb-4">
      <svg class="w-8 h-8 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"/>
      </svg>
    </div>
    <p class="text-white font-bold text-lg">E-mail envoyé !</p>
    <p class="text-gray-400 text-sm mt-2">Si cet email est enregistré, vous recevrez un lien de réinitialisation sous peu.</p>
    <a href="/login" class="inline-block mt-6 text-indigo-400 hover:text-indigo-300 text-sm underline underline-offset-2 transition">Retour à la connexion</a>
  </div>

</div>
<script>
  document.getElementById('forgot-form').addEventListener('submit', async e => {
    e.preventDefault();
    const email = document.getElementById('inp-email').value.trim();
    if (!email) return;
    const btn = document.getElementById('submit-btn');
    btn.disabled = true; btn.textContent = 'Envoi…';
    try {
      const res  = await fetch('/api/merchants/forgot-password', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email }),
      });
      await res.json();
      // Always show success (security: don't reveal if email exists)
      document.getElementById('form-wrap').style.display    = 'none';
      document.getElementById('success-wrap').style.display = 'block';
    } catch {
      const el = document.getElementById('form-error');
      document.getElementById('err-msg').textContent = 'Erreur réseau. Réessayez.';
      el.classList.remove('hidden'); el.style.display = 'flex';
      btn.disabled = false; btn.textContent = 'Envoyer le lien';
    }
  });
</script>
</body>
</html>
