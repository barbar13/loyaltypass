<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#FAF6EE">
  <title>Connexion commerçant — Fidelyzio</title>
  <meta name="description" content="Connectez-vous à votre espace commerçant Fidelyzio pour gérer votre programme de fidélité.">
  <link rel="canonical" href="https://fidelyzio.com/login">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/favicon.svg">
  <script>
    try {
      const auth = JSON.parse(localStorage.getItem('fidelyzio_auth'));
      if (auth && auth.token) window.location.replace('/scanner');
    } catch (_) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/css/fidelyzio-design.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { min-height: 100%; overflow-x: hidden; overscroll-behavior: none;
      background: var(--bg); color: var(--ink);
      font-family: "Geist", ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased; font-size: 16px; margin: 0; padding: 0; }
    input, button { font-family: inherit; font-size: 16px; }
    a { color: inherit; text-decoration: none; }

    @keyframes fade-up { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:translateY(0); } }
    @keyframes spin    { to { transform: rotate(360deg); } }
    .au  { animation: fade-up .4s cubic-bezier(.16,1,.3,1) both; }
    .d1  { animation-delay:.06s; }
    .d2  { animation-delay:.12s; }

    .page { min-height: 100dvh; display: flex; flex-direction: column; align-items: center;
      justify-content: center;
      padding: max(1.5rem, env(safe-area-inset-top)) 20px max(1.5rem, env(safe-area-inset-bottom)); }
    .inner { width: 100%; max-width: 380px; }

    /* Brand */
    .page-brand { display: flex; align-items: center; justify-content: center; gap: 10px;
      font-weight: 600; letter-spacing: -0.02em; font-size: 19px; color: var(--ink); margin-bottom: 6px; }

    /* Form card */
    .form-card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-lg);
      padding: 30px 26px; box-shadow: 0 2px 24px rgba(26,20,16,.06); margin-top: 20px; }

    /* Fields */
    .field-wrap { margin-bottom: 18px; }
    .field-label { display: block; font-size: 13px; font-weight: 500; color: var(--ink-2); margin-bottom: 7px; }
    .field { width: 100%; background: var(--bg); border: 1px solid var(--line);
      border-radius: var(--radius); padding: 13px 15px; color: var(--ink); outline: none;
      transition: border-color .2s, box-shadow .2s; }
    .field::placeholder { color: var(--muted); }
    .field:focus { border-color: var(--amber-2); box-shadow: 0 0 0 3px rgba(245,158,11,.12); }
    .pwd-wrap { position: relative; }
    .pwd-toggle { position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: var(--muted); cursor: pointer; padding: 4px;
      display: flex; align-items: center; }
    .pwd-toggle:hover { color: var(--ink); }

    /* Error */
    .error-box { display: none; margin-bottom: 16px; border-radius: 12px; padding: 12px 14px;
      background: rgba(239,68,68,.07); border: 1px solid rgba(239,68,68,.2);
      color: #dc2626; font-size: 13px; align-items: center; gap: 8px; }
    .error-box.visible { display: flex; }

    /* Submit */
    .btn-primary { width: 100%; padding: 14px; border-radius: var(--radius);
      font-size: 15px; font-weight: 600; border: none; cursor: pointer;
      background: var(--ink); color: #FFF8EA;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 4px 16px rgba(26,20,16,.18);
      transition: background .15s, transform .12s; margin-top: 4px; }
    .btn-primary:hover { background: #2A211B; transform: translateY(-1px); }
    .btn-primary:active { transform: scale(.98); }
    .btn-primary:disabled { opacity: .55; cursor: not-allowed; transform: none; }

    /* Footer links */
    .register-link { margin-top: 20px; text-align: center; font-size: 14px; color: var(--muted); }
    .register-link a { color: var(--ink-2); font-weight: 500; text-decoration: underline; text-underline-offset: 2px; }
    .register-link a:hover { color: var(--ink); }
  </style>
</head>
<body>

<div class="page">
  <div class="inner">

    <!-- Brand -->
    <a href="/home" class="page-brand au">
      <div class="brand-mark"></div>
      Fidelyzio
    </a>
    <p style="text-align:center;font-size:14px;color:var(--muted);margin-bottom:0" class="au d1">Espace marchand</p>

    <!-- Form card -->
    <form id="login-form" class="form-card au d1" novalidate>

      <div class="field-wrap">
        <label class="field-label" for="inp-email">Email</label>
        <input id="inp-email" type="email" autocomplete="email" placeholder="vous@email.com" required class="field">
      </div>

      <div class="field-wrap">
        <label class="field-label" for="inp-password">Mot de passe</label>
        <div class="pwd-wrap">
          <input id="inp-password" type="password" autocomplete="current-password" placeholder="••••••••" required
                 class="field" style="padding-right:44px">
          <button type="button" onclick="togglePwd()" tabindex="-1" class="pwd-toggle">
            <svg id="eye-icon" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.641 0-8.573-3.007-9.964-7.178Z"/>
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Error -->
      <div id="form-error" class="error-box" role="alert">
        <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" style="flex-shrink:0">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z"/>
        </svg>
        <span id="form-error-msg"></span>
      </div>

      <button id="submit-btn" type="submit" class="btn-primary">Se connecter</button>
    </form>

    <!-- Register link -->
    <p class="register-link au d2">
      Pas encore inscrit ?
      <a href="/register">Créer un compte →</a>
    </p>

  </div>
</div>

<script>
  function showError(msg) {
    const el = document.getElementById('form-error');
    document.getElementById('form-error-msg').textContent = msg;
    el.classList.add('visible');
  }
  function hideError() { document.getElementById('form-error').classList.remove('visible'); }

  function togglePwd() {
    const inp  = document.getElementById('inp-password');
    const icon = document.getElementById('eye-icon');
    const show = inp.type === 'password';
    inp.type   = show ? 'text' : 'password';
    icon.innerHTML = show
      ? `<path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88"/>`
      : `<path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.641 0-8.573-3.007-9.964-7.178Z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/>`;
  }

  document.getElementById('login-form').addEventListener('submit', async e => {
    e.preventDefault();
    hideError();

    const email    = document.getElementById('inp-email').value.trim();
    const password = document.getElementById('inp-password').value;
    if (!email || !password) { showError('Veuillez remplir tous les champs.'); return; }

    const btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.innerHTML = `<span style="display:flex;align-items:center;justify-content:center;gap:8px">
      <svg style="width:16px;height:16px;animation:spin 1s linear infinite" fill="none" viewBox="0 0 24 24">
        <circle style="opacity:.25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
        <path style="opacity:.75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/>
      </svg>Connexion…</span>`;

    try {
      const res  = await fetch('/api/merchants/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Identifiants invalides');

      localStorage.setItem('fidelyzio_auth', JSON.stringify({ merchant: data.merchant, token: data.token, expires: Date.now() + 90 * 24 * 60 * 60 * 1000 }));
      window.location.replace('/scanner');
    } catch (err) {
      showError(err.message);
      btn.disabled = false;
      btn.textContent = 'Se connecter';
    }
  });
</script>
<script src="/js/cookie-consent.js"></script>
</body>
</html>
