<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f0f14">
  <title>Ma carte – Fidelyzio</title>
  <script>
    // Redirect immediately if we have the card URL — before any paint
    try {
      const url = localStorage.getItem('fidelyzio_card_url');
      if (url) { window.location.replace(url); }
    } catch (_) {}
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; background: #0f0f14; color: white;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .pt-safe { padding-top: max(1.5rem, env(safe-area-inset-top)); }
    .pb-safe { padding-bottom: max(1.5rem, env(safe-area-inset-bottom)); }
  </style>
</head>
<body>

<!-- No card found state (only shown when localStorage is empty or unavailable) -->
<div id="no-card" class="min-h-dvh flex flex-col items-center justify-center px-8 text-center">
  <div class="w-16 h-16 rounded-2xl bg-indigo-600/15 border border-indigo-500/20 flex items-center justify-center mx-auto mb-5">
    <svg class="w-8 h-8 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
      <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 8.25h19.5M2.25 9h19.5m-16.5 5.25h6m-6 2.25h3m-3.75 3h15a2.25 2.25 0 0 0 2.25-2.25V6.75A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25v10.5A2.25 2.25 0 0 0 4.5 19.5Z"/>
    </svg>
  </div>
  <h1 class="text-xl font-bold text-white mb-2">Aucune carte trouvée</h1>
  <p class="text-gray-400 text-sm leading-relaxed mb-1">
    Vous n'avez pas encore de carte Fidelyzio sur cet appareil.
  </p>
  <p class="text-gray-600 text-xs mb-8">
    Scannez le QR code d'un commerçant partenaire pour créer votre carte gratuitement.
  </p>
  <a href="/home"
     class="px-6 py-3 bg-indigo-600 hover:bg-indigo-500 active:scale-95 rounded-2xl text-white text-sm font-semibold transition-all shadow-lg">
    Retour à l'accueil
  </a>
</div>

</body>
</html>
