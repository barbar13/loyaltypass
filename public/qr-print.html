<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Fidélité — Fidevo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Screen ─────────────────────────────────────────────────────────────── */
    body {
      background: #0a0a0f;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #e5e7eb;
      min-height: 100vh;
    }

    .screen-header {
      position: sticky; top: 0; z-index: 10;
      background: rgba(10,10,15,.95); backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(255,255,255,.06);
      padding: 14px 24px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .screen-header a {
      display: flex; align-items: center; gap-6px; gap: 6px;
      color: #9ca3af; text-decoration: none; font-size: 13px; font-weight: 500;
      transition: color .15s;
    }
    .screen-header a:hover { color: white; }
    .header-actions { display: flex; align-items: center; gap: 10px; }
    .btn-print {
      display: flex; align-items: center; gap: 6px;
      background: #6366f1; color: white;
      border: none; cursor: pointer; border-radius: 10px;
      padding: 9px 18px; font-size: 13px; font-weight: 600;
      transition: background .15s, transform .1s;
    }
    .btn-print:hover { background: #4f46e5; }
    .btn-print:active { transform: scale(.97); }
    .btn-download {
      display: flex; align-items: center; gap: 6px;
      background: transparent; color: #9ca3af;
      border: 1px solid rgba(255,255,255,.1); cursor: pointer; border-radius: 10px;
      padding: 9px 16px; font-size: 13px; font-weight: 500;
      transition: color .15s, border-color .15s;
    }
    .btn-download:hover { color: white; border-color: rgba(255,255,255,.25); }

    .preview-area {
      display: flex; align-items: flex-start; justify-content: center;
      padding: 48px 24px 64px;
    }

    /* ── Print card ─────────────────────────────────────────────────────────── */
    .print-card {
      background: white;
      width: 420px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 30px 80px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.05);
      display: flex; flex-direction: column; align-items: center;
    }

    /* Color bar at top */
    .color-bar {
      width: 100%; height: 10px;
      background: var(--brand, #6366f1);
    }

    .card-body {
      padding: 40px 40px 36px;
      display: flex; flex-direction: column; align-items: center;
      text-align: center; width: 100%;
    }

    /* Merchant avatar */
    .merchant-avatar {
      width: 88px; height: 88px; border-radius: 50%;
      background: var(--brand, #6366f1);
      display: flex; align-items: center; justify-content: center;
      font-size: 36px; font-weight: 900; color: white;
      margin-bottom: 16px;
      box-shadow: 0 12px 32px color-mix(in srgb, var(--brand, #6366f1) 35%, transparent);
    }

    .merchant-name {
      font-size: 26px; font-weight: 800; color: #111827;
      line-height: 1.2; margin-bottom: 4px;
    }
    .merchant-subtitle {
      font-size: 13px; color: #9ca3af; font-weight: 500; margin-bottom: 28px;
    }

    /* Divider */
    .divider {
      width: 100%; height: 1px; background: #f3f4f6; margin-bottom: 28px;
    }

    /* QR code */
    .qr-wrapper {
      background: white; padding: 12px; border-radius: 16px;
      border: 2px solid #f3f4f6;
      margin-bottom: 28px;
      display: flex; align-items: center; justify-content: center;
    }
    .qr-wrapper img { display: block; border-radius: 8px; }

    .divider2 {
      width: 100%; height: 1px; background: #f3f4f6; margin-bottom: 24px;
    }

    /* Tagline */
    .tagline {
      font-size: 19px; font-weight: 700; color: #111827;
      line-height: 1.3; margin-bottom: 8px;
    }
    .tagline-sub {
      font-size: 12px; color: #9ca3af; margin-bottom: 24px; line-height: 1.5;
    }

    /* Footer */
    .card-footer {
      width: 100%; padding: 16px 40px;
      background: #f9fafb; border-top: 1px solid #f3f4f6;
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px;
    }
    .footer-badges {
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    }
    .footer-badge {
      display: flex; align-items: center; gap: 4px;
      font-size: 10px; color: #9ca3af; font-weight: 500;
    }
    .footer-logo {
      font-size: 11px; font-weight: 700; color: #6366f1;
      white-space: nowrap;
    }

    /* ── Print media ─────────────────────────────────────────────────────────── */
    @page {
      size: A5;
      margin: 0;
    }

    @media print {
      body { background: white !important; }

      .no-print { display: none !important; }

      .preview-area {
        padding: 0; display: block;
      }

      .print-card {
        width: 148mm; min-height: 210mm;
        border-radius: 0; box-shadow: none;
        margin: 0; padding: 0;
      }

      .card-body { padding: 14mm 14mm 10mm; }
      .merchant-avatar { width: 72px; height: 72px; font-size: 28px; }
      .merchant-name { font-size: 22px; }
      .qr-wrapper { margin-bottom: 22px; }
      .tagline { font-size: 17px; }
      .card-footer { padding: 12px 14mm; }

      /* Ensure colors print */
      * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
    }
  </style>
</head>
<body>

<!-- Screen nav (hidden when printing) -->
<header class="screen-header no-print">
  <a href="/">
    <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
      <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18"/>
    </svg>
    Retour au tableau de bord
  </a>
  <div class="header-actions">
    <p id="header-merchant-name" style="font-size:13px;color:#6b7280;font-weight:500"></p>
    <button class="btn-print" onclick="window.print()">
      <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6.72 13.829c-.24.03-.48.062-.72.096m.72-.096a42.415 42.415 0 0 1 10.56 0m-10.56 0L6.34 18m10.94-4.171c.24.03.48.062.72.096m-.72-.096L17.66 18m0 0 .229 2.523a1.125 1.125 0 0 1-1.12 1.227H7.231c-.662 0-1.18-.568-1.12-1.227L6.34 18m11.318 0h1.091A2.25 2.25 0 0 0 21 15.75V9.456c0-1.081-.768-2.015-1.837-2.175a48.055 48.055 0 0 0-1.913-.247M6.34 18H5.25A2.25 2.25 0 0 1 3 15.75V9.456c0-1.081.768-2.015 1.837-2.175a48.056 48.056 0 0 1 1.913-.247m10.5 0a48.536 48.536 0 0 0-10.5 0m10.5 0V3.375c0-.621-.504-1.125-1.125-1.125h-8.25c-.621 0-1.125.504-1.125 1.125v3.659M18 10.5h.008v.008H18V10.5Zm-3 0h.008v.008H15V10.5Z"/>
      </svg>
      Imprimer
    </button>
  </div>
</header>

<!-- Card preview -->
<div class="preview-area">
  <div class="print-card" id="print-card">
    <div class="color-bar" id="color-bar"></div>
    <div class="card-body">

      <!-- Merchant identity -->
      <div class="merchant-avatar" id="merchant-avatar">?</div>
      <h1 class="merchant-name" id="merchant-name">Chargement…</h1>
      <p class="merchant-subtitle">Programme de fidélité</p>

      <div class="divider"></div>

      <!-- QR code -->
      <div class="qr-wrapper">
        <img id="qr-img" src="" alt="QR code d'inscription" width="260" height="260"
             style="display:block;border-radius:8px">
      </div>

      <div class="divider2"></div>

      <!-- Call to action -->
      <p class="tagline">Scannez pour gagner<br>des points fidélité</p>
      <p class="tagline-sub">
        Gratuit · Sans application<br>Vos données sont protégées
      </p>

    </div>

    <!-- Footer -->
    <div class="card-footer">
      <div class="footer-badges">
        <span class="footer-badge">
          <svg width="11" height="11" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg>
          Inscription gratuite
        </span>
        <span class="footer-badge">
          <svg width="11" height="11" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 1.5H8.25A2.25 2.25 0 0 0 6 3.75v16.5a2.25 2.25 0 0 0 2.25 2.25h7.5A2.25 2.25 0 0 0 18 20.25V3.75a2.25 2.25 0 0 0-2.25-2.25H13.5m-3 0V3h3V1.5m-3 0h3m-3 18.75h3"/></svg>
          Sans application
        </span>
      </div>
      <span class="footer-logo">◆ Fidevo</span>
    </div>
  </div>
</div>

<script>
  (function () {
    let auth;
    try {
      auth = JSON.parse(localStorage.getItem('loyaltypass_auth'));
    } catch (_) {}

    if (!auth || !auth.merchant) {
      window.location.href = '/login';
      return;
    }

    const merchant = auth.merchant;
    const color    = merchant.color || '#6366f1';

    // Apply branding
    document.documentElement.style.setProperty('--brand', color);
    document.getElementById('color-bar').style.background = color;
    document.getElementById('merchant-avatar').textContent     = merchant.name.charAt(0).toUpperCase();
    document.getElementById('merchant-avatar').style.background = color;
    document.getElementById('merchant-avatar').style.boxShadow  = `0 12px 32px ${color}55`;
    document.getElementById('merchant-name').textContent         = merchant.name;
    document.getElementById('header-merchant-name').textContent  = merchant.name;

    // Set page title
    document.title = `QR ${merchant.name} — Fidevo`;

    // Load high-res QR for print quality
    const qr = document.getElementById('qr-img');
    qr.src = `/api/merchants/${merchant.id}/enroll-qr?size=600`;
    qr.onerror = () => { qr.style.opacity = '.4'; };
  })();
</script>
</body>
</html>
