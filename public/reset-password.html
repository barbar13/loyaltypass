<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0f">
  <title>Nouveau mot de passe — Fidevo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { min-height: 100%; background: #0a0a0f; color: #e5e7eb;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    input { font-size: 16px !important; }
    .pt-safe { padding-top: max(1.5rem, env(safe-area-inset-top)); }
    .pb-safe { padding-bottom: max(1.5rem, env(safe-area-inset-bottom)); }
    .field { width:100%; background:#1a1a24; border:1px solid rgba(255,255,255,.1);
      border-radius:14px; padding:14px 16px; color:white; outline:none;
      transition: border-color .2s, box-shadow .2s; }
    .field::placeholder { color:#4b5563; }
    .field:focus { border-color:#6366f1; box-shadow:0 0 0 3px rgba(99,102,241,.2); }
    @keyframes fade-up { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
    .au { animation: fade-up .4s cubic-bezier(.16,1,.3,1) both; }
  </style>
</head>
<body>
<div class="min-h-dvh flex flex-col items-center justify-center px-5 pt-safe pb-safe">

  <!-- Invalid token -->
  <div id="s-invalid" style="display:none" class="text-center au">
    <div class="w-16 h-16 rounded-full bg-red-500/15 flex items-center justify-center mx-auto mb-4">
      <svg class="w-8 h-8 text-red-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/>
      </svg>
    </div>
    <p class="text-red-400 font-bold text-lg">Lien invalide ou expiré</p>
    <p class="text-gray-400 text-sm mt-2">Veuillez recommencer la procédure de réinitialisation.</p>
    <a href="/forgot-password" class="inline-block mt-6 px-6 py-3 bg-indigo-600 hover:bg-indigo-500 rounded-2xl text-white text-sm font-semibold transition">Renvoyer un lien</a>
  </div>

  <!-- Form -->
  <div id="s-form" style="display:none" class="w-full max-w-sm au">
    <div class="mb-8 text-center">
      <h1 class="text-white text-2xl font-bold">Nouveau mot de passe</h1>
      <p class="text-gray-500 text-sm mt-1">Choisissez un mot de passe sécurisé.</p>
    </div>
    <form id="reset-form" class="bg-gray-900 rounded-3xl p-6 shadow-2xl space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-300 mb-2">Nouveau mot de passe</label>
        <input id="inp-pwd" type="password" autocomplete="new-password" placeholder="Minimum 6 caractères" required class="field">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-300 mb-2">Confirmer le mot de passe</label>
        <input id="inp-pwd2" type="password" autocomplete="new-password" placeholder="••••••••" required class="field">
      </div>
      <div id="form-error" class="hidden rounded-xl px-4 py-3 bg-red-500/10 border border-red-500/25 text-red-400 text-sm flex items-center gap-2">
        <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z"/></svg>
        <span id="err-msg"></span>
      </div>
      <button type="submit" id="submit-btn"
              class="w-full py-4 rounded-2xl bg-indigo-600 hover:bg-indigo-500 active:scale-[.98] disabled:opacity-60 text-white font-semibold text-base transition-all">
        Enregistrer le nouveau mot de passe
      </button>
    </form>
  </div>

  <!-- Success -->
  <div id="s-success" style="display:none" class="text-center au">
    <div class="w-16 h-16 rounded-full bg-emerald-500/15 flex items-center justify-center mx-auto mb-4">
      <svg class="w-8 h-8 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"/>
      </svg>
    </div>
    <p class="text-white font-bold text-lg">Mot de passe mis à jour !</p>
    <p class="text-gray-400 text-sm mt-2">Vous pouvez maintenant vous connecter avec votre nouveau mot de passe.</p>
    <a href="/login" class="inline-block mt-6 px-6 py-3 bg-indigo-600 hover:bg-indigo-500 rounded-2xl text-white text-sm font-semibold transition">Se connecter</a>
  </div>

  <!-- Loading -->
  <div id="s-loading" class="flex flex-col items-center gap-4">
    <div class="w-10 h-10 rounded-full border-2 border-white/10 border-t-white/60 animate-spin"></div>
    <p class="text-gray-500 text-sm">Vérification du lien…</p>
  </div>

</div>
<script>
  const token = new URLSearchParams(window.location.search).get('token');

  function show(id) {
    ['s-loading','s-invalid','s-form','s-success'].forEach(s => {
      document.getElementById(s).style.display = 'none';
    });
    document.getElementById(id).style.display = 'flex';
    document.getElementById(id).style.flexDirection = 'column';
    if (id === 's-form') document.getElementById(id).style.alignItems = 'stretch';
    else document.getElementById(id).style.alignItems = 'center';
  }

  if (!token) {
    show('s-invalid');
  } else {
    // Validate token by trying a dummy request (we'll just show the form)
    // Actual validation happens on submit
    show('s-form');
  }

  document.getElementById('reset-form').addEventListener('submit', async e => {
    e.preventDefault();
    const pwd  = document.getElementById('inp-pwd').value;
    const pwd2 = document.getElementById('inp-pwd2').value;

    if (pwd.length < 6) { showErr('Minimum 6 caractères.'); return; }
    if (pwd !== pwd2)   { showErr('Les mots de passe ne correspondent pas.'); return; }

    const btn = document.getElementById('submit-btn');
    btn.disabled = true; btn.textContent = 'Enregistrement…';

    try {
      const res  = await fetch('/api/merchants/reset-password', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, password: pwd }),
      });
      const data = await res.json();
      if (!res.ok) { showErr(data.error); btn.disabled = false; btn.textContent = 'Enregistrer'; return; }
      show('s-success');
    } catch {
      showErr('Erreur réseau. Réessayez.');
      btn.disabled = false; btn.textContent = 'Enregistrer le nouveau mot de passe';
    }
  });

  function showErr(msg) {
    const el = document.getElementById('form-error');
    document.getElementById('err-msg').textContent = msg;
    el.classList.remove('hidden'); el.style.display = 'flex';
  }
</script>
</body>
</html>
